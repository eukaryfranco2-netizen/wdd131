<!DOCTYPE html>
<html lang="in-EG">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Conhecendo a Venezuela: dados gerais como capital, população, idioma e moeda, além das condições do clima, com temperatura, vento e sensação térmica.">
    <meta name="author" content="Eukary Franco">
    <title>Página do País | WDD 131</title>

    <link rel="stylesheet" href="estilos/local.css">
    <script src="scripts/local.js" defer></script>
</head>
<body>

    <header>
        <h1>Venezuela</h1>
    </header>

    <main>
        <div class="principal">
            <picture>
                <source srcset="imagens/salto-angel-venezuela.webp" media="(min-width: 1000px)">
                <source srcset="imagens/salto-angel-venezuela.webp" media="(min-width: 500px)">
                <img src="imagens/salto-angel-venezuela.webp" alt="SaltoAngel" width="500" height="250">
            </picture>
        </div>

        <!-- Seção de dados -->
        <section class="dados">
            <h2>Dados</h2>
            <ul>
                <li><strong>Capital:</strong> Caracas</li>
                <li><strong>População:</strong> 28.4 milhões (2021)</li>
                <li><strong>Idioma:</strong> Espanhol</li>
                <li><strong>Moeda:</strong> Bolívar (VES)</li>
            </ul>
        </section>

        <!-- Seção de clima -->
        <section class="clima">
            <h2>Clima</h2>
            <ul>
                <li><strong>Temperatura:</strong><span id="temperatura"> 28</span>°C</li>
                <li><strong>Condições:</strong> Nublado</li>
                <li><strong>Vento:</strong> <span id="vento">10</span> km/h</li>
                <li><strong>Sensação térmica:</strong> 26<span id="sensacao">ºC</span></li>
            </ul>
        </section>

    </main>

    <footer>
        <p>&copy; <span id="anoAtual"></span> Eukary Franco | Brasil</p>
        <p>Última modificação: <span id="ultimaModificacao"></span></p>
    </footer>

</body>
</html>
