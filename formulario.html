<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulário para avaliar produtos: escolha o produto, dê uma nota, informe a data de instalação e escreva sua opinião.">
    <meta name="author" content="Seu Nome">
    <title>Avaliação de Produto</title>
    <link rel="stylesheet" href="estilos/formulario.css">
    <script src="scripts/formulario.js" defer></script>
</head>
<body>
    <header>
        <h1>Avaliação de Produto</h1>
    </header>

    <main>
        <form action="avaliacao.html" method="get">

            <div class="campo">
                <label for="produto">Nome do Produto</label>
                <select id="produto" name="produto" required>
                    <option value="" disabled selected>Selecione um Produto...</option>
                    <!-- As demais opções serão criadas com JavaScript -->
                </select>
            </div>

            <fieldset class="campo">
                <legend>Classificação Geral</legend>
                <div class="estrelas">
                    <input type="radio" id="nota1" name="nota" value="1" required>
                    <label for="nota1">&star; 1</label>

                    <input type="radio" id="nota2" name="nota" value="2" required>
                    <label for="nota2">&star; 2</label>

                    <input type="radio" id="nota3" name="nota" value="3" required>
                    <label for="nota3">&star; 3</label>

                    <input type="radio" id="nota4" name="nota" value="4" required>
                    <label for="nota4">&star; 4</label>

                    <input type="radio" id="nota5" name="nota" value="5" required>
                    <label for="nota5">&star; 5</label>
                </div>
            </fieldset>

            <div class="campo">
                <label for="data-instalacao">Data de Instalação</label>
                <input type="date" id="data-instalacao" name="data-instalacao" required>
            </div>

            <fieldset class="campo">
                <legend>Recursos Úteis (marque todos que se aplicam)</legend>
                <div class="opcao">
                    <input type="checkbox" id="recurso-facil" name="recursos" value="facil-de-usar">
                    <label for="recurso-facil">Fácil de usar</label>
                </div>
                <div class="opcao">
                    <input type="checkbox" id="recurso-duravel" name="recursos" value="duravel">
                    <label for="recurso-duravel">Durável</label>
                </div>
                <div class="opcao">
                    <input type="checkbox" id="recurso-design" name="recursos" value="design">
                    <label for="recurso-design">Design</label>
                </div>
                <div class="opcao">
                    <input type="checkbox" id="recurso-custo" name="recursos" value="custo-beneficio">
                    <label for="recurso-custo">Bom custo-benefício</label>
                </div>
            </fieldset>

            <div class="campo">
                <label for="avaliacao-escrita">Avaliação Escrita (opcional)</label>
                <textarea id="avaliacao-escrita" name="avaliacao-escrita" rows="5"></textarea>
            </div>

            <div class="campo">
                <label for="usuario">Nome de Usuário (opcional)</label>
                <input type="text" id="usuario" name="usuario">
            </div>

            <input type="submit" value="Enviar Avaliação">
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Eukary Franco | Brasil</p>
        <p>Última modificação: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
