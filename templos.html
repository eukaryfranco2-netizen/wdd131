
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Álbum de fotografias de templos">
    <meta name="author" content="Eukary Franco">

    <title>Álbum do Templo</title>

    <!-- Arquivos CSS -->
    <link rel="stylesheet" href="estilos/templos.css">
    <link rel="stylesheet" href="estilos/templos-grandes.css">

    <!-- Arquivo JavaScript -->
    <script src="scripts/templos.js" defer></script>
</head>

<body>

    <!-- CABEÇALHO -->
    <header>

        <h2>Álbum do Templo</h2>

        <button id="menu" type="button" aria-label="Abrir menu">
            ≡
        </button>

        <!-- MENU DE NAVEGAÇÃO -->
        <nav>
            <a href="index.html">Página Inicial</a>
            <a href="antigo.html">Antigo</a>
            <a href="novo.html">Novo</a>
            <a href="grande.html">Grande</a>
            <a href="pequeno.html">Pequeno</a>
        </nav>

    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main>

        <h1>Templos</h1>

        <!-- GALERIA DE FOTOS -->
        <section class="galeria">

            <figure>
                <img src="imagens/templo.sao.paulo.jpg"  alt="Templo de São Paulo"  loading="lazy"  width="300"  height="200">
                <figcaption>Templo de São Paulo</figcaption>
            </figure>

            <figure>
                <img src="imagens/templo.rio.de.janeiro.jpg"   alt="Templo do Rio de Janeiro"   loading="lazy"   width="300"  height="200">
                <figcaption>Templo do Rio de Janeiro</figcaption>
            </figure>

            <figure>
                <img src="imagens/templo.brasilia.jpeg"   alt="Templo de Brasília"   loading="lazy"    width="300"   height="200">
                <figcaption>Templo de Brasília</figcaption>
            </figure>

            <figure>
                <img src="imagens/templo.berna.suica.jpg"   alt="Templo de Berna, Suíça"    loading="lazy"   width="300"   height="200">
                <figcaption>Templo de Berna, Suíça</figcaption>
            </figure>

            <figure>
                <img src="imagens/templo.fortaleza.jpg"   alt="Templo de Fortaleza"  loading="lazy"    width="300"   height="200">
                <figcaption>Templo de Fortaleza</figcaption>
            </figure>

            <figure>
                <img src="imagens/templo.caracas.venezuela.jpg"  alt="Templo de Caracas, Venezuela"   loading="lazy"   width="300"  height="200">
                <figcaption>Templo de Caracas, Venezuela</figcaption>
            </figure>

            <figure>
                <img src="imagens/templo.toronto.canada.jpg"   alt="Templo de Toronto, Canadá"  loading="lazy"  width="300" height="200">
                <figcaption>Templo de Toronto, Canadá</figcaption>
            </figure>

            <figure>
                <img src="imagens/templo.puebla.mexico.jpg"  alt="Templo de Puebla, México"   loading="lazy" width="300"  height="200">
                <figcaption>Templo de Puebla, México</figcaption>
            </figure>

            <figure>
                <img src="imagens/templo.corea.do.sur.jpg"  alt="Templo de Seul, Coreia do Sul" loading="lazy" width="300" height="200">
                <figcaption>Templo de Seul, Coreia do Sul</figcaption>
            </figure>

        </section>

    </main>

    <!-- RODAPÉ -->
    <footer>

        <p>&copy; <span id="ano"></span>Eukary Franco - Brazil</p>
